services:
  mysql:
    image: mysql:8.0
    container_name: artisan_mysql
    restart: unless-stopped
    environment:
      # Empty root password to match backend/.env defaults (dev only).
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: artisan_db
    ports:
      - "3306:3306"
    volumes:
      - artisan_mysql_data:/var/lib/mysql
      # Auto-create tables on first start.
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Lightweight web UI to browse the database at http://localhost:8080
  adminer:
    image: adminer:latest
    container_name: artisan_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  artisan_mysql_data:
